{% extends "admin/base.html" %}
{% block title %}Customers - Admin{% endblock %}
{% block content %}
<h1>Customers</h1>
<table class="admin-table">
    <tr><th>Name</th><th>Email</th><th>Phone</th><th>Joined</th></tr>
    {% for c in customers %}
    <tr>
        <td>{{ c.full_name }}</td>
        <td>{{ c.email }}</td>
        <td>{{ c.phone }}</td>
        <td>{{ c.created_at.strftime('%d %b %Y') }}</td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
