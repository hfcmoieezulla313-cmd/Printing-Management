{% extends "base.html" %}
{% block title %}Upload Document - PrintCare{% endblock %}
{% block content %}
<div class="form-page">
    <h1>Upload Document</h1>
    <p class="detail-desc">For: {{ service.name }}</p>

    <form method="post" enctype="multipart/form-data" class="form-stack">
        <label>Choose file (PDF, DOC, DOCX, JPG, JPEG, PNG)
            <input type="file" name="document" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png" required>
        </label>
        <label>Number of pages
            <input type="number" name="page_count" min="1" value="1" required>
        </label>
        <button type="submit" class="btn btn-primary btn-block">Continue to Configuration</button>
    </form>
</div>
{% endblock %}
{% block extra_js %}<script src="{{ url_for('static', filename='js/upload.js') }}"></script>{% endblock %}
