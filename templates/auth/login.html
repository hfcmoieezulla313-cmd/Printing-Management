{% extends "base.html" %}
{% block title %}Login - PrintCare{% endblock %}
{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <h1 class="brand-lg">Print<span>Care</span></h1>
        <p class="auth-subtitle">Log in to continue</p>
        <form method="post" class="form-stack">
            <label>Email or Phone
                <input type="text" name="identifier" required placeholder="you@example.com or 9876543210">
            </label>
            <label>Password
                <input type="password" name="password" required placeholder="••••••••">
            </label>
            <button type="submit" class="btn btn-primary btn-block">Login</button>
        </form>
        <p class="auth-switch">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
    </div>
</div>
{% endblock %}
