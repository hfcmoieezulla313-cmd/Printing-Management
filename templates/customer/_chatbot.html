<div id="chatbot-root">
    <button id="chatbot-toggle" aria-label="Open chat">💬</button>

    <div id="chatbot-window" class="hidden">
        <div class="chatbot-header">
            <div>
                <div class="chatbot-title">PrintCare AI</div>
                <div class="chatbot-subtitle">Your Printing Assistant</div>
            </div>
            <button id="chatbot-close" aria-label="Close chat">✕</button>
        </div>

        <div id="chatbot-messages" class="chatbot-messages">
            <div class="chat-bubble chat-bubble-ai">
                Hi! I'm PrintCare AI. Ask me about prices, orders, delivery or anything else.
            </div>
        </div>

        <div id="chatbot-suggestions" class="chatbot-suggestions"></div>

        <div id="chatbot-typing" class="chatbot-typing hidden">PrintCare AI is typing…</div>

        <form id="chatbot-form" class="chatbot-input-row">
            <input type="text" id="chatbot-input" placeholder="Ask me anything..." autocomplete="off">
            <button type="submit">➤</button>
        </form>
    </div>
</div>
