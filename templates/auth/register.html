{% extends "base.html" %}
{% block title %}Register - PrintCare{% endblock %}
{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <h1 class="brand-lg">Print<span>Care</span></h1>
        <p class="auth-subtitle">Create your account</p>
        <form method="post" class="form-stack">
            <label>Full Name
                <input type="text" name="full_name" required value="{{ form.get('full_name','') }}">
            </label>
            <label>Email
                <input type="email" name="email" required value="{{ form.get('email','') }}">
            </label>
            <label>Phone (10 digits)
                <input type="text" name="phone" required value="{{ form.get('phone','') }}">
            </label>
            <label>Password
                <input type="password" name="password" required>
            </label>
            <label>Confirm Password
                <input type="password" name="confirm_password" required>
            </label>
            <button type="submit" class="btn btn-primary btn-block">Create Account</button>
        </form>
        <p class="auth-switch">Already have an account? <a href="{{ url_for('auth.login') }}">Login</a></p>
    </div>
</div>
{% endblock %}
